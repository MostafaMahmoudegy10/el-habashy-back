spring.application.name=el-habashy-back


spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=${DATABASE_SCHEMA:el_habashy}
spring.flyway.schemas=${DATABASE_SCHEMA:el_habashy}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:el_habashy}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.open-in-view=false

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.audience=${JWT_AUDIENCE}
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=30d
app.security.jwt.refresh-cookie-name=elhabashy_refresh
app.security.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.security.jwt.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:None}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://el-habashy-oc1dqsbgj-tefamams-projects.vercel.app,http://localhost:5173}

spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:mostafa.mahmoudegy10@gmail.com}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:https://el-habashy-oc1dqsbgj-tefamams-projects.vercel.app/}
app.mail.backend-public-url=${BACKEND_PUBLIC_URL:http://localhost:8080}
app.mail.activation-token-ttl=24h
app.mail.password-reset-otp-ttl=10m
app.mail.resend-cooldown=1m

# Cloudinary credentials are supplied through environment variables.
