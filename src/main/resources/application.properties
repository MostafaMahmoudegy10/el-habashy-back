cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:djtnuxbw6}
cloudinary.api-key=${CLOUDINARY_API_KEY:812913212164696}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:6srczVIjFQB83mJnYtmba_jvfkQ}
cloudinary.folder=${CLOUDINARY_FOLDER:el-habashy/listings}
cloudinary.api-base-url=${CLOUDINARY_API_BASE_URL:https://api.cloudinary.com}

# Multipart files are streamed/spooled by the servlet container. Videos are then
# moved to this application-owned staging directory for background chunk upload.
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=6GB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=${MEDIA_UPLOAD_INCOMING_DIR:./data/incoming-media}
media.upload.temp-dir=${MEDIA_UPLOAD_TEMP_DIR:./data/media-temp}

# Seeded administrator account. Override these values in production when needed.
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:true}
app.seed.admin.first-name=${ADMIN_SEED_FIRST_NAME:Mostafa}
app.seed.admin.last-name=${ADMIN_SEED_LAST_NAME:Mahmoud}
app.seed.admin.email=${ADMIN_SEED_EMAIL:mostafa.mahmoudegy10@gmail.com}
app.seed.admin.password=${ADMIN_SEED_PASSWORD:password}
