spring.datasource.url=jdbc:h2:mem:elhabashy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.security.jwt.secret=test-only-secret-key-with-at-least-32-characters
app.security.jwt.issuer=el-habashy-test
app.security.jwt.audience=el-habashy-test-client
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=30d
app.security.jwt.refresh-cookie-name=elhabashy_refresh
app.security.jwt.refresh-cookie-secure=false
app.security.jwt.refresh-cookie-same-site=Strict

app.security.cors.allowed-origins=http://localhost:*

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

app.mail.from=no-reply@elhabashy.test
app.mail.frontend-base-url=http://localhost:5173
app.mail.backend-public-url=http://localhost:8080
app.mail.activation-token-ttl=24h
app.mail.password-reset-otp-ttl=10m
app.mail.resend-cooldown=1m

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret
cloudinary.folder=test/listings
cloudinary.api-base-url=https://api.cloudinary.com
